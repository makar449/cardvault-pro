<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardVault — оплата заказа</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fffdf8,#f3e7d6);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#201a14}.card{width:min(680px,92vw);background:#fffdf8;border:1px solid #e4d7c5;border-radius:26px;box-shadow:0 22px 70px rgba(47,34,15,.14);padding:34px}.logo{font-family:Georgia,serif;color:#8b621e;font-size:32px;margin-bottom:8px}h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:0 0 14px}p{color:#665b50;line-height:1.55}.box{border:1px solid #e4d7c5;background:#fff8ed;border-radius:16px;padding:18px;margin:20px 0}.btn{height:46px;border-radius:11px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #cba96e;text-decoration:none;color:#8a601d;font-weight:800;margin-right:10px}.btn.primary{background:linear-gradient(180deg,#c79640,#a97620);color:#fff;border-color:#a97620}</style></head><body><main class="card"><div class="logo">CardVault</div><h1 id="title">Заказ создан</h1><p id="lead"></p><div class="box"><b>Что дальше?</b><p id="details"></p></div><a class="btn primary" href="/">Вернуться на сайт</a><a class="btn" href="/admin.html">Админ-панель</a></main><script>const p=new URLSearchParams(location.search),order=p.get('order')||'ваш заказ',status=p.get('status')||'manual';document.getElementById('lead').textContent=status==='success'?`Оплата по заказу ${order} прошла успешно.`:status==='cancel'?`Оплата по заказу ${order} отменена. Заказ сохранён, можно связаться с поддержкой.`:`Заказ ${order} сохранён в базе и ожидает оплаты.`;document.getElementById('details').textContent=status==='success'?'Мы начинаем проверку, упаковку и подготовку к доставке. Статусы будут видны в личном кабинете.':'В этой сборке включён реальный backend и ручной способ оплаты. Для банковских карт подключите Stripe/YooKassa/эквайринг через env-переменные, после чего покупатель будет перенаправляться на платежную страницу.';</script></body></html>
